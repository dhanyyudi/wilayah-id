name: Web CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_container:
        description: Skip the validation container when the caller publishes it
        required: false
        type: boolean
        default: false

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Next.js application
        run: pnpm build

      - name: Verify built runtime health
        run: pnpm verify:runtime

      - name: Build Cloudflare artifact
        run: pnpm build:cf

      - name: Validate Wrangler deployment bundle
        run: pnpm exec wrangler deploy --dry-run

  build-container:
    if: inputs.skip_container != true
    needs: verify-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build web container
        run: docker build --tag wilayah-id:web-ci .
