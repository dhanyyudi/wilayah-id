name: Docker Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-web:
    uses: ./.github/workflows/web-ci.yml
    with:
      skip_container: true
    permissions:
      contents: read

  build-and-push:
    needs: verify-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and load candidate image
        id: build-candidate
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: |
            wilayah-id:publish-candidate-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Verify candidate runtime health
        env:
          CANDIDATE_IMAGE: wilayah-id:publish-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          HEALTH_CONTAINER: wilayah-id-publish-health-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          health_port=$((20000 + GITHUB_RUN_ID % 20000))
          health_headers="$(mktemp)"
          cleanup() {
            docker rm -f "${HEALTH_CONTAINER}" >/dev/null 2>&1 || true
            rm -f "${health_headers}"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          docker run --rm -d \
            --name "${HEALTH_CONTAINER}" \
            -p "127.0.0.1:${health_port}:3000" \
            "${CANDIDATE_IMAGE}"

          health_json=""
          health_status=""
          for attempt in $(seq 1 30); do
            if health_json=$(curl \
              --connect-timeout 1 \
              --max-time 2 \
              --dump-header "${health_headers}" \
              --fail --silent --show-error \
              "http://127.0.0.1:${health_port}/api/health" 2>/dev/null); then
              if health_status=$(printf '%s' "${health_json}" | python3 -c \
                'import json,sys; print(json.load(sys.stdin).get("status", ""))') && \
                test "${health_status}" = "ok" && \
                grep -qi '^cache-control:.*no-store' "${health_headers}"; then
                break
              fi
            fi

            if test "${attempt}" -eq 30; then
              docker logs "${HEALTH_CONTAINER}" || true
              exit 1
            fi
            sleep 1
          done

          printf 'health_port=%s health=%s\n' "${health_port}" "${health_json}"
          test "${health_status}" = "ok"
          grep -qi '^cache-control:.*no-store' "${health_headers}"

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image tags
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            test -n "${tag}" || continue
            docker push "${tag}"
          done <<< "${PUBLISH_TAGS}"
