name: MCP CI

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - "docker-compose.yml"
      - "deploy/docker-compose.homeserver.mcp.yml"
      - ".github/workflows/mcp-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mcp/**"
      - "docker-compose.yml"
      - "deploy/docker-compose.homeserver.mcp.yml"
      - ".github/workflows/mcp-ci.yml"

jobs:
  verify-mcp:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spatial_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spatial_fixture"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/requirements.txt

      - name: Install MCP dependencies
        run: python -m pip install -r mcp/requirements.txt

      - name: Install PostgreSQL and GDAL clients
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y postgresql-client gdal-bin

      - name: Prepare PostGIS integration schema
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            --host 127.0.0.1 \
            --username postgres \
            --dbname spatial_fixture \
            --set ON_ERROR_STOP=1 \
            --command "CREATE EXTENSION IF NOT EXISTS postgis"
          psql \
            --host 127.0.0.1 \
            --username postgres \
            --dbname spatial_fixture \
            --set ON_ERROR_STOP=1 \
            --file mcp/tests/fixtures/wilayah_schema_fixture.sql

      - name: Run MCP contract, protocol, and PostGIS integration tests
        working-directory: mcp
        env:
          TEST_DATABASE_URL: >-
            postgresql://postgres:postgres@127.0.0.1:5432/spatial_fixture?options=-csearch_path%3Dmcp_test%2Cpublic
        run: |
          python -m unittest discover -s tests -v
          python -m compileall server.py wilayah_mcp

      - name: Run PostGIS predicate fixture
        env:
          PGPASSWORD: postgres
        run: >-
          psql
          --host 127.0.0.1
          --username postgres
          --dbname spatial_fixture
          --set ON_ERROR_STOP=1
          --command "CREATE EXTENSION IF NOT EXISTS postgis"
          --file mcp/tests/fixtures/spatial_fixture.sql

      - name: Build MCP container
        run: docker build --tag wilayah-id-mcp:test mcp
