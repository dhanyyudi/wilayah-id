services:
  db:
    image: postgis/postgis:17-3.5
    container_name: wilayah-id-db
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wilayah_id}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - private_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wilayah_id"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: ghcr.io/dhanyyudi/wilayah-id:latest
    container_name: wilayah-id-app
    restart: unless-stopped
    networks:
      - private_network
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wilayah_id?sslmode=disable
      NEXT_PUBLIC_TILES_BASE_URL: /tiles
    volumes:
      - ./public/tiles:/app/public/tiles:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/v1/regions/provinces', r => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mcp-server:
    build: ./mcp
    container_name: wilayah-id-mcp
    environment:
      # Use the read-only user for MCP
      - DATABASE_URL=postgresql://${POSTGRES_READER_USER:-wilayah_reader}:${POSTGRES_READER_PASSWORD:-wilayah_reader_secret}@db:5432/${POSTGRES_DB:-wilayah_id}
      - MCP_DB_POOL_MIN=${MCP_DB_POOL_MIN:-1}
      - MCP_DB_POOL_MAX=${MCP_DB_POOL_MAX:-5}
      - MCP_STATEMENT_TIMEOUT_MS=${MCP_STATEMENT_TIMEOUT_MS:-5000}
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_ALLOWED_HOSTS=127.0.0.1:*,localhost:*,mcp-server:*,wilayah-id-mcp:*
      - MCP_ARTIFACT_DIR=/tmp/wilayah-mcp-artifacts
      - MCP_ARTIFACT_TTL_SECONDS=${MCP_ARTIFACT_TTL_SECONDS:-900}
      - MCP_MAX_GEOMETRY_POINTS=${MCP_MAX_GEOMETRY_POINTS:-50000}
      - MCP_MAX_SUBSET_FEATURES=${MCP_MAX_SUBSET_FEATURES:-5000}
      - MCP_MAX_AOI_BYTES=${MCP_MAX_AOI_BYTES:-1048576}
      - MCP_MAX_ARTIFACT_BYTES=${MCP_MAX_ARTIFACT_BYTES:-52428800}
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    networks:
      - private_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pgwatch2:
    image: cybertec/pgwatch2:latest
    container_name: wilayah-id-pgwatch2
    restart: unless-stopped
    networks:
      - private_network
    environment:
      - PW2_TESTDB=false
    volumes:
      - ./data/pgwatch2_data:/var/lib/postgresql
      - ./data/pgwatch2_grafana:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy

networks:
  private_network:
    external: true

# =============================================================
# SETUP: Load data after starting (choose one method):
#
#  a) SQL Dump (recommended — ~5 menit):
#     wget https://github.com/dhanyyudi/wilayah-id/releases/latest/download/wilayah_id.dump
#     docker exec -i wilayah-id-db pg_restore -U postgres -d wilayah_id -j 4 < wilayah_id.dump
#
#  b) Build from source (~30 menit):
#     python -m venv etl-venv && source etl-venv/bin/activate
#     pip install -r etl/requirements.txt
#     DATABASE_URL=postgresql://postgres:postgres@localhost:5432/wilayah_id python etl/import_all.py
# =============================================================
