services:
  wilayah-id-mcp:
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_ALLOWED_HOSTS: >-
        127.0.0.1:*,
        localhost:*,
        wilayah-id-mcp:*,
        wilayah-id-mcp.dhanypedia.it.com
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
