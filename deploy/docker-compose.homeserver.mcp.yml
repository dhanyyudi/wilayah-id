services:
  mcp-server:
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_API_KEYS_SHA256: ${MCP_API_KEYS_SHA256:?set MCP_API_KEYS_SHA256}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:?set MCP_PUBLIC_BASE_URL}
      MCP_ALLOWED_HOSTS: >-
        127.0.0.1:*,
        localhost:*,
        wilayah-id-mcp:*,
        wilayah-id-mcp-staging.dhanypedia.it.com,
        wilayah-id-mcp.dhanypedia.it.com
      MCP_ARTIFACT_DIR: /tmp/wilayah-mcp-artifacts
      MCP_ARTIFACT_TTL_SECONDS: 900
      MCP_MAX_GEOMETRY_POINTS: 50000
      MCP_MAX_SUBSET_FEATURES: 5000
      MCP_MAX_AOI_BYTES: 1048576
      MCP_MAX_ARTIFACT_BYTES: 52428800
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
