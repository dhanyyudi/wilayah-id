server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Static vector tiles are an anonymous public interface.
    add_header Access-Control-Allow-Origin  "*"                        always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS"       always;
    add_header Access-Control-Allow-Headers "Origin, Accept, Range"    always;
    add_header Cache-Control "public, max-age=86400, immutable" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    types {
        application/vnd.mapbox-vector-tile pbf;
    }
    default_type application/octet-stream;

    location / {
        try_files $uri =404;
        gzip_static on;
    }

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    access_log off;
    error_log /var/log/nginx/tiles-error.log warn;
}
